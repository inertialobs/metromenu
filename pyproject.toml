[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "metromenu"
version = "0.1.0"
description = "Windows 10 style start menu for Linux desktops (Xfce and LXQt)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-2.0-or-later" }

[project.scripts]
metromenu = "metromenu.application:main"

[tool.setuptools]
packages = ["metromenu"]

[tool.setuptools.package-data]
metromenu = ["style.css"]
